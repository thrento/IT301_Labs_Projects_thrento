<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
</head>
<body>
    <header>
        <h1>JavaScript Calculator</h1>
    </header>
    <label for="name">Enter your name:</label>
    <input type="text" id="name" name="name">
    <button onclick="user()">Submit</button>
    <h2 id="greeting"></h2>
    <p>Enter Numbers below:</p>
    <label for="num1">Enter the first number:</label>
    <input type="number" id="num1" name="num1"><br>
    <label for="num2">Enter the second number:</label>
    <input type="number" id="num2" name="num2"><br>
    <p>Pick Operation:</p>
    <input type="radio" id="add" name="operation" value="add">
    <label for="add">Add</label><br>
    <input type="radio" id="subtract" name="operation" value="subtract">
    <label for="subtract">Subtract</label><br>
    <input type="radio" id="multiply" name="operation" value="multiply">
    <label for="multiply">Multiply</label><br>
    <input type="radio" id="divide" name="operation" value="divide">
    <label for="divide">Divide</label><br>
    <button onclick="calculate()">Calculate</button>
    <p id="answer"></p>
    <script>
        function user() {
            const name = document.getElementById("name").value;
            document.getElementById("greeting").textContent = "Hello, " + name + "!";
        }
        function calculate(){
            const input1 = document.getElementById("num1");
            const input2 = document.getElementById("num2");
            const num1 = parseFloat(input1.value);
            const num2 = parseFloat(input2.value);
            const operation = document.querySelector('input[name="operation"]:checked').value;
            let result;
            if (operation === "add"){
                result = num1 + num2;
            } else if (operation === "subtract"){
                result = num1 - num2;
            } else if (operation === "multiply"){
                result = num1 * num2;
            } else if (operation === "divide"){
                result = num1 / num2;
            }
            document.getElementById("answer").textContent = "Result: " + result;
    }
    </script>
</body>
</html>
