<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        // task 1
        fetch("https://jsonplaceholder.typicode.com/posts")
            .then(response => response.json())
            .then(posts => {
                console.table(posts);
                // task 3/task 4
                let filterBtn = document.getElementById('filterBtn');
                filterBtn.addEventListener('click', function() {
                    let userID = document.getElementById('userID').value;
                    posts.forEach(post => {
                        if (post.userId == userID) {
                            console.table(post);
                        }
                    });
                });
                // task 5
                let displayUserBtn = document.getElementById('displayUserBtn');
                displayUserBtn.addEventListener('click', function() {
                    let displayUserID = document.getElementById('displayUserID').value;
                    let userPosts = posts.filter(post => post.userId == displayUserID);
                    displayPosts(userPosts);
                });
                // task 6
                let findBtn = document.getElementById('findBtn');
                findBtn.addEventListener('click', function() {
                    let postID = document.getElementById('postID').value;
                    let displayUserID = document.getElementById('displayUserID').value;
                    let foundPost = posts.find(post => post.id === Number(postID));
                    if (foundPost) {
                        displayPosts([foundPost]);
                    } else {
                        alert("Post not found.");
                    }
                });
            });
        // task 2 display all
        let profileDisplay = document.createElement('div');
        document.body.appendChild(profileDisplay);
        function displayPosts(posts) {
            profileDisplay.innerHTML = '';
            posts.forEach(post => {
                let article = document.createElement('article');
                let h2 = document.createElement('h2');
                h2.textContent = post.title;
                let p = document.createElement('p');
                p.textContent = post.body;
                let userId = document.createElement('p');
                userId.textContent = "User ID: " + post.userId;
                let postID = document.createElement('p');
                postID.textContent = "Post ID: " + post.id;
                article.appendChild(h2);
                article.appendChild(p);
                article.appendChild(userId);
                article.appendChild(postID)
                profileDisplay.appendChild(article);
            })
        }



    </script>

</body>
</html>
