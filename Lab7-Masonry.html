            margin-bottom: 10px;
            font-size: 20px;
        }
        #trash{
            margin-top: auto;
        }
        #right{
            display: flex;
            flex-wrap: wrap;
            overflow-y: auto;
        }
        img{
            flex-grow: 1;
            border: 1px solid white;
            height: 100px;
            align-items: flex-start;
        }
        #left *:hover{
