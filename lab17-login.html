<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <form>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email">
        <br><br>
        <label for="password">Password: </label>
        <input type="password" id="password" placeholder="Password">
        <br><br>
        <button type="button" id="login">Login</button>
    </form>
    <p id="message"></p>
    <!-- Connects to Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <!-- Accesses the database -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <!-- Handles user login -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCzJ6gZlR1I_XVdgaBKjFGhsTDHy2Rl9To",
            authDomain: "lab17database-af29c.firebaseapp.com",
            projectId: "lab17database-af29c",
            storageBucket: "lab17database-af29c.firebasestorage.app",
            messagingSenderId: "253092435855",
            appId: "1:253092435855:web:dd5cbe2201fcb2ae7c1dfa"
        };
        // Connect to Firebase
        firebase.initializeApp(firebaseConfig);
        // Connect to Firestore
        const db = firebase.firestore();

        const auth = firebase.auth();
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const login = document.getElementById('login');
        const message = document.getElementById('message');

        login.addEventListener('click', async () => {
            try {
                const cred = await auth.signInWithEmailAndPassword(
                    email.value.trim(), password.value);
                const uid = cred.user.uid;
                const userDoc = await db.collection("users").doc(uid).get();
                const role = userDoc.data().role;
                if (role === "faculty") {
                    window.location.href = "lab17-firestore.html";
                } else {
                    window.location.href = "lab17-student.html";
                }
            } catch (error) {
                message.textContent = "Login failed. Check your details.";
            }
        });
    </script>

</body>

</html>
