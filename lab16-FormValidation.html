<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         #password-rules {
            display: none;
            margin-top: 5px;
        }

        /* Show the rules div when the password field is focused */
        #password:focus + #password-rules {
            display: block;
        }
    </style>
</head>
<body>
    <form action="#" method="post" id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="********">
        <div  class="rules" id="password-rules">
            <div id="rule-length" class="rule">✖ At least 6 characters</div>
            <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
            <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
        </div>
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <script>
        const form = document.getElementById('myForm');
        const passwordInput = document.getElementById('password');
        const ruleLength = document.getElementById('rule-length');
        const ruleSpecial = document.getElementById('rule-special');
        const ruleUppercase = document.getElementById('rule-uppercase');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;

            // Check for length
            if (password.length >= 6) {
                ruleLength.textContent = '✔ At least 6 characters';
                ruleLength.style.color = 'green';
            } else {
                ruleLength.textContent = '✖ At least 6 characters';
                ruleLength.style.color = 'red';
            }

            // Check for special character
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                ruleSpecial.textContent = '✔ Must include a special character (!@#$...)';
                ruleSpecial.style.color = 'green';
            } else {
                ruleSpecial.textContent = '✖ Must include a special character (!@#$...)';
                ruleSpecial.style.color = 'red';
            }

            // Check for uppercase letter
            if (/[A-Z]/.test(password)) {
                ruleUppercase.textContent = '✔ Must include an uppercase letter (A-Z)';
                ruleUppercase.style.color = 'green';
            } else {
                ruleUppercase.textContent = '✖ Must include an uppercase letter (A-Z)';
                ruleUppercase.style.color = 'red';
            }
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            alert('Form submitted successfully!');
        });
    </script>
</body>
</html>
